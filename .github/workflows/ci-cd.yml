name: CI/CD

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/nikalexan/food-delivery-project-go

jobs:
  deploy:
    name: Deploy to DOKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DO_CLUSTER_NAME }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/

      - name: Update images
        env:
          SHA: ${{ github.event.client_payload.sha || 'latest' }}
        run: |
          kubectl set image deployment/api-gateway \
            api-gateway=${{ env.REGISTRY }}/api-gateway:${SHA} -n fooddelivery
          kubectl set image deployment/user-service \
            user-service=${{ env.REGISTRY }}/user-service:${SHA} -n fooddelivery
          kubectl set image deployment/restaurant-service \
            restaurant-service=${{ env.REGISTRY }}/restaurant-service:${SHA} -n fooddelivery
          kubectl set image deployment/order-service \
            order-service=${{ env.REGISTRY }}/order-service:${SHA} -n fooddelivery
          kubectl set image deployment/delivery-service \
            delivery-service=${{ env.REGISTRY }}/delivery-service:${SHA} -n fooddelivery
          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/frontend:${SHA} -n fooddelivery || true

      - name: Verify rollout
        run: kubectl rollout status deployment/api-gateway -n fooddelivery --timeout=120s || true
