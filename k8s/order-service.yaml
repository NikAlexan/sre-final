apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: fooddelivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/nikalexan/food-delivery-project-go/order-service:latest
          command: ["sh", "-c", "until nc -z postgres-order 5432; do echo waiting for postgres; sleep 2; done && ./goose -dir migrations postgres \"$DATABASE_URL\" up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fooddelivery-secret
                  key: DATABASE_URL_ORDER
      containers:
        - name: order-service
          image: ghcr.io/nikalexan/food-delivery-project-go/order-service:latest
          ports:
            - containerPort: 50053
          env:
            - name: GRPC_ADDR
              value: ":50053"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fooddelivery-secret
                  key: DATABASE_URL_ORDER
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: NATS_URL
          readinessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: fooddelivery
spec:
  selector:
    app: order-service
  ports:
    - port: 50053
