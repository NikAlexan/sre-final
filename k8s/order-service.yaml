apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: fooddelivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/nikalexan/food-delivery-project-go/order-service:latest
          ports:
            - containerPort: 50053
          env:
            - name: GRPC_ADDR
              value: ":50053"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fooddelivery-secret
                  key: DATABASE_URL_ORDER
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: NATS_URL
          readinessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: fooddelivery
spec:
  selector:
    app: order-service
  ports:
    - port: 50053
