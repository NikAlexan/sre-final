apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: fooddelivery
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      containers:
        - name: delivery-service
          image: ghcr.io/nikalexan/food-delivery-project-go/delivery-service:latest
          ports:
            - containerPort: 50054
          env:
            - name: GRPC_ADDR
              value: ":50054"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fooddelivery-secret
                  key: DATABASE_URL_DELIVERY
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: REDIS_ADDR
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: NATS_URL
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: SMTP_PORT
            - name: EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: EMAIL_FROM
          readinessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: fooddelivery
spec:
  selector:
    app: delivery-service
  ports:
    - port: 50054
