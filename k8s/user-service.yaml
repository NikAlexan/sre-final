apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: fooddelivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/nikalexan/food-delivery-project-go/user-service:latest
          command: ["sh", "-c", "./goose -dir migrations postgres \"$DATABASE_URL\" up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fooddelivery-secret
                  key: DATABASE_URL_USER
      containers:
        - name: user-service
          image: ghcr.io/nikalexan/food-delivery-project-go/user-service:latest
          ports:
            - containerPort: 50051
          env:
            - name: GRPC_ADDR
              value: ":50051"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fooddelivery-secret
                  key: DATABASE_URL_USER
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: REDIS_ADDR
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: NATS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fooddelivery-secret
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: fooddelivery
spec:
  selector:
    app: user-service
  ports:
    - port: 50051
