apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fooddelivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/nikalexan/food-delivery-project-go/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fooddelivery-secret
                  key: JWT_SECRET
            - name: USER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: USER_SERVICE_ADDR
            - name: RESTAURANT_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: RESTAURANT_SERVICE_ADDR
            - name: ORDER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: ORDER_SERVICE_ADDR
            - name: DELIVERY_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: DELIVERY_SERVICE_ADDR
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fooddelivery
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
