apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fooddelivery-alerts
  namespace: fooddelivery
  labels:
    release: kube-prometheus-stack
    app: fooddelivery
spec:
  groups:
    - name: fooddelivery.availability
      interval: 30s
      rules:
        - alert: FoodDeliveryServiceDown
          expr: |
            kube_deployment_status_replicas_available{namespace="fooddelivery"} == 0
          for: 1m
          labels:
            severity: critical
            namespace: fooddelivery
          annotations:
            summary: "Service {{ $labels.deployment }} has zero available replicas"
            description: "Deployment {{ $labels.deployment }} in namespace fooddelivery has had 0 available replicas for more than 1 minute."
            runbook: "Check pod logs: kubectl logs -l app={{ $labels.deployment }} -n fooddelivery"

        - alert: FoodDeliveryDeploymentReplicasMismatch
          expr: |
            kube_deployment_status_replicas_available{namespace="fooddelivery"}
              < kube_deployment_spec_replicas{namespace="fooddelivery"}
          for: 5m
          labels:
            severity: warning
            namespace: fooddelivery
          annotations:
            summary: "Deployment {{ $labels.deployment }} is under-replicated"
            description: "{{ $labels.deployment }} has fewer available replicas than desired for more than 5 minutes."
            runbook: "kubectl describe deployment {{ $labels.deployment }} -n fooddelivery"

        - alert: FoodDeliveryAvailabilitySLOBreach
          expr: |
            avg(
              kube_deployment_status_replicas_available{namespace="fooddelivery"}
              / kube_deployment_spec_replicas{namespace="fooddelivery"}
            ) * 100 < 99
          for: 5m
          labels:
            severity: critical
            namespace: fooddelivery
          annotations:
            summary: "FoodDelivery availability SLO breach — below 99%"
            description: "Overall deployment availability has dropped below 99% for more than 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."

    - name: fooddelivery.errors
      interval: 30s
      rules:
        - alert: FoodDeliveryPodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="fooddelivery"}[15m]) * 60 > 1
          for: 5m
          labels:
            severity: warning
            namespace: fooddelivery
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is restarting more than once per minute."
            runbook: "kubectl logs {{ $labels.pod }} -n fooddelivery --previous"

        - alert: FoodDeliveryPodNotReady
          expr: |
            kube_pod_status_ready{namespace="fooddelivery", condition="true"} == 0
          for: 5m
          labels:
            severity: warning
            namespace: fooddelivery
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.pod }} has been in a non-ready state for more than 5 minutes."
            runbook: "kubectl describe pod {{ $labels.pod }} -n fooddelivery"

        - alert: FoodDeliveryPodPending
          expr: |
            kube_pod_status_phase{namespace="fooddelivery", phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
            namespace: fooddelivery
          annotations:
            summary: "Pod {{ $labels.pod }} is stuck in Pending"
            description: "Pod {{ $labels.pod }} has been pending for more than 10 minutes. Check resource availability or PVC binding."

    - name: fooddelivery.saturation
      interval: 60s
      rules:
        - alert: FoodDeliveryHighCPU
          expr: |
            sum(
              rate(container_cpu_usage_seconds_total{
                namespace="fooddelivery",
                container!="",
                container!="POD"
              }[5m])
            ) by (pod, container)
            /
            sum(
              kube_pod_container_resource_limits{
                namespace="fooddelivery",
                resource="cpu",
                container!=""
              }
            ) by (pod, container) > 0.80
          for: 10m
          labels:
            severity: warning
            namespace: fooddelivery
          annotations:
            summary: "High CPU usage for {{ $labels.container }} in {{ $labels.pod }}"
            description: "Container {{ $labels.container }} is using more than 80% of its CPU limit for 10 minutes (current: {{ $value | printf \"%.0f\" }}%)."

        - alert: FoodDeliveryHighMemory
          expr: |
            sum(
              container_memory_working_set_bytes{
                namespace="fooddelivery",
                container!="",
                container!="POD"
              }
            ) by (pod, container)
            /
            sum(
              kube_pod_container_resource_limits{
                namespace="fooddelivery",
                resource="memory",
                container!=""
              }
            ) by (pod, container) > 0.80
          for: 10m
          labels:
            severity: warning
            namespace: fooddelivery
          annotations:
            summary: "High memory usage for {{ $labels.container }} in {{ $labels.pod }}"
            description: "Container {{ $labels.container }} is using more than 80% of its memory limit for 10 minutes (current: {{ $value | printf \"%.0f\" }}%)."

        - alert: FoodDeliveryHPAAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="fooddelivery"}
              == kube_horizontalpodautoscaler_spec_max_replicas{namespace="fooddelivery"}
          for: 15m
          labels:
            severity: warning
            namespace: fooddelivery
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} is at max replicas"
            description: "HPA {{ $labels.horizontalpodautoscaler }} has been at its maximum replica count for 15 minutes. Consider increasing maxReplicas."

        - alert: FoodDeliveryHPAScalingLimited
          expr: |
            kube_horizontalpodautoscaler_status_condition{
              namespace="fooddelivery",
              condition="ScalingLimited",
              status="true"
            } == 1
          for: 15m
          labels:
            severity: warning
            namespace: fooddelivery
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} scaling is limited"
            description: "HPA {{ $labels.horizontalpodautoscaler }} cannot scale further due to max replicas or cluster resource constraints."
