apiVersion: v1
kind: ConfigMap
metadata:
  name: fooddelivery-sli-dashboard
  namespace: kube-prometheus-stack
  labels:
    grafana_dashboard: "1"
data:
  fooddelivery-sli.json: |
    {
      "id": null,
      "uid": "fooddelivery-sli",
      "title": "FoodDelivery — SLI Dashboard",
      "description": "Service Level Indicators for the FoodDelivery platform",
      "tags": ["fooddelivery", "sli", "kubernetes"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Data Source",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Availability SLI",
          "description": "Average % of replicas available across all deployments (target ≥ 99%)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 2,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 95 },
                  { "color": "green", "value": 99 }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "avg(kube_deployment_status_replicas_available{namespace=\"fooddelivery\"} / kube_deployment_spec_replicas{namespace=\"fooddelivery\"}) * 100",
              "instant": true,
              "legendFormat": "Availability",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Healthy Deployments",
          "description": "Deployments at full replica count",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 4 },
                  { "color": "green", "value": 5 }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "count(kube_deployment_status_replicas_available{namespace=\"fooddelivery\"} >= kube_deployment_spec_replicas{namespace=\"fooddelivery\"})",
              "instant": true,
              "legendFormat": "Healthy",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Running Pods",
          "description": "Total running pods in fooddelivery namespace",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "green", "value": 7 }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "count(kube_pod_status_phase{namespace=\"fooddelivery\", phase=\"Running\"} == 1)",
              "instant": true,
              "legendFormat": "Pods",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Restarts (24h)",
          "description": "Total container restarts in last 24 hours — proxy for error rate",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 3 },
                  { "color": "red", "value": 10 }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"fooddelivery\"}[24h]))",
              "instant": true,
              "legendFormat": "Restarts",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "gauge",
          "title": "Availability per Deployment",
          "description": "Replica availability per deployment — core Availability SLI (target: 100%)",
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 4 },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "auto",
            "showThresholdMarkers": true,
            "showThresholdLabels": false
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 1,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 95 },
                  { "color": "green", "value": 99 }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kube_deployment_status_replicas_available{namespace=\"fooddelivery\"} / kube_deployment_spec_replicas{namespace=\"fooddelivery\"} * 100",
              "instant": true,
              "legendFormat": "{{deployment}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "CPU Usage by Container",
          "description": "CPU cores consumed per container (Saturation SLI)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 11 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10, "gradientMode": "none" }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"fooddelivery\", container!=\"\", container!=\"POD\"}[5m])) by (container)",
              "legendFormat": "{{container}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Memory Usage by Container",
          "description": "Working set memory per container (Saturation SLI)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 11 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10, "gradientMode": "none" }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"fooddelivery\", container!=\"\", container!=\"POD\"}) by (container)",
              "legendFormat": "{{container}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "CPU Usage vs Limit (% of limit)",
          "description": "CPU saturation per container as % of resource limit",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.7 },
                  { "color": "red", "value": 0.85 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"fooddelivery\", container!=\"\", container!=\"POD\"}[5m])) by (container) / sum(kube_pod_container_resource_limits{namespace=\"fooddelivery\", resource=\"cpu\", container!=\"\"}) by (container)",
              "legendFormat": "{{container}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Memory Usage vs Limit (% of limit)",
          "description": "Memory saturation per container as % of resource limit",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.7 },
                  { "color": "red", "value": 0.85 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"fooddelivery\", container!=\"\", container!=\"POD\"}) by (container) / sum(kube_pod_container_resource_limits{namespace=\"fooddelivery\", resource=\"memory\", container!=\"\"}) by (container)",
              "legendFormat": "{{container}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "HPA — Current vs Max Replicas",
          "description": "Scaling headroom. Alert fires when current == max for 15 minutes.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 27 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 5 }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"fooddelivery\"}",
              "legendFormat": "{{horizontalpodautoscaler}} (current)",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"fooddelivery\"}",
              "legendFormat": "{{horizontalpodautoscaler}} (max)",
              "refId": "B"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Pod Restart Rate — Error Proxy SLI",
          "description": "Restarts per minute per pod. Proxy for error rate when app metrics are unavailable.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 35 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 15 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(kube_pod_container_status_restarts_total{namespace=\"fooddelivery\"}[5m])) by (pod) * 60",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Network I/O — Receive",
          "description": "Bytes received per second by pod",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 43 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"fooddelivery\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Network I/O — Transmit",
          "description": "Bytes transmitted per second by pod",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 43 },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"fooddelivery\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
