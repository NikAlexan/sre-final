apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: fooddelivery
  labels:
    app: locust-worker
    component: load-testing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: locust-worker
  template:
    metadata:
      labels:
        app: locust-worker
        component: load-testing
    spec:
      containers:
        - name: locust-worker
          image: locustio/locust:2.29.1
          args:
            - "-f"
            - "/locust/locustfile.py"
            - "--worker"
            - "--master-host=locust-master"
          volumeMounts:
            - name: locustfile
              mountPath: /locust
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: locustfile
          configMap:
            name: locust-script
