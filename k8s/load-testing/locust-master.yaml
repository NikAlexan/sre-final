apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: fooddelivery
  labels:
    app: locust-master
    component: load-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust-master
  template:
    metadata:
      labels:
        app: locust-master
        component: load-testing
    spec:
      containers:
        - name: locust-master
          image: locustio/locust:2.29.1
          args:
            - "-f"
            - "/locust/locustfile.py"
            - "--master"
            - "--expect-workers=3"
          ports:
            - name: web-ui
              containerPort: 8089
            - name: master-p1
              containerPort: 5557
            - name: master-p2
              containerPort: 5558
          volumeMounts:
            - name: locustfile
              mountPath: /locust
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: locustfile
          configMap:
            name: locust-script
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: fooddelivery
  labels:
    app: locust-master
    component: load-testing
spec:
  type: LoadBalancer
  selector:
    app: locust-master
  ports:
    - name: web-ui
      port: 8089
      targetPort: 8089
    - name: master-p1
      port: 5557
      targetPort: 5557
    - name: master-p2
      port: 5558
      targetPort: 5558
