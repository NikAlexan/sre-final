apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: fooddelivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/nikalexan/food-delivery-project-go/restaurant-service:latest
          command: ["sh", "-c", "./goose -dir migrations postgres \"$DATABASE_URL\" up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fooddelivery-secret
                  key: DATABASE_URL_RESTAURANT
      containers:
        - name: restaurant-service
          image: ghcr.io/nikalexan/food-delivery-project-go/restaurant-service:latest
          ports:
            - containerPort: 50052
          env:
            - name: GRPC_ADDR
              value: ":50052"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fooddelivery-secret
                  key: DATABASE_URL_RESTAURANT
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: REDIS_ADDR
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: fooddelivery-config
                  key: NATS_URL
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: fooddelivery
spec:
  selector:
    app: restaurant-service
  ports:
    - port: 50052
